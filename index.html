    <h2>Согласие на обработку персональных данных</h2>
    <p>Редакция 19 ноября 2026</p>
    <p>Я, оставляя заявку на сайте мебельной студии, свободно, своей волей и в своём интересе даю согласие ИП *************** (ИНН ************, ОГРНИП ***************) на обработку моих персональных данных: имени и номера телефона.</p>
    <p>Цель обработки — связаться со мной, подготовить расчёт мебели, организовать замер и исполнение договора. С данными совершаются запись, хранение, уточнение и удаление.</p>
    <p>Заявка хранится в браузере на этом устройстве. Если владелец подключил Telegram или таблицу Google, копия заявки уходит и туда. Иных получателей у данных нет.</p>
    <p>Согласие действует до его отзыва. Отозвать согласие можно сообщением в Telegram или WhatsApp, указанные на сайте. Отзыв не отменяет обработку, которую нужно продолжить по уже заключённому договору.</p>
    <p>Состав данных, сроки и порядок удаления описаны в Политике конфиденциальности.</p>
  </template>
